# Bassir Leads — reverse proxy. Replace leads.bassir.net with your domain.
# For HTTPS: run certbot once (see README), then uncomment the 443 block.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    server_name leads.bassir.net;
    client_max_body_size 50m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # the designer agent can take 1-2 minutes
    }
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

