services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bassir
      POSTGRES_USER: bassir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bassir}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bassir"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: /srv/uploads
    volumes:
      - uploads:/srv/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
      - certs-www:/var/www/certbot
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-bassir}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U bassir bassir | gzip > /backups/bassir-$(date +%F).sql.gz; tar czf /backups/uploads-$(date +%F).tgz -C /uploads . 2>/dev/null; find /backups \\( -name '*.sql.gz' -o -name '*.tgz' \\) -mtime +30 -delete; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  certs:
  certs-www:
